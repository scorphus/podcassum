name: watch podcasts

on:
  # GitHub sometimes drops scheduled runs; a run that finds nothing new takes a minute
  schedule:
    - cron: "37 23 * * *"
    - cron: "37 1 * * *"
    - cron: "37 3 * * *"
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency: watch

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: scorphus/podcassum-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: uv run podcassum.py
        env:
          PYTHONUNBUFFERED: "1"
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
