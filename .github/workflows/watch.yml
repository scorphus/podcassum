name: watch podcasts

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

concurrency: watch

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: scorphus/podcassum-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: data
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: uv run podcassum.py
        env:
          PYTHONUNBUFFERED: "1"
          CLAUDE_TASK_URL: ${{ secrets.CLAUDE_TASK_URL }}
          CLAUDE_TASK_TOKEN: ${{ secrets.CLAUDE_TASK_TOKEN }}
